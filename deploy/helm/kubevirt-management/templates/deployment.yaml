apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubevirt-management.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-management.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "kubevirt-management.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubevirt-management.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubevirt-management.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: OIDC_ISSUER
              value: {{ required ".Values.auth.oidc.issuer is required" .Values.auth.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required ".Values.auth.oidc.clientID is required" .Values.auth.oidc.clientID | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ required ".Values.auth.oidc.redirectURL is required" .Values.auth.oidc.redirectURL | quote }}
            - name: OIDC_USERNAME_CLAIM
              value: {{ .Values.auth.oidc.usernameClaim | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .Values.auth.oidc.groupsClaim | quote }}
            - name: OIDC_SCOPES
              value: {{ join "," .Values.auth.oidc.scopes | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubevirt-management.secretName" . }}
                  key: clientSecret
            - name: SESSION_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubevirt-management.secretName" . }}
                  key: sessionHashKey
            - name: SESSION_BLOCK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubevirt-management.secretName" . }}
                  key: sessionBlockKey
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
